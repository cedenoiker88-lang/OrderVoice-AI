name: Criterio 2 - Monolito OrderVoice AI
on:
  push:
    branches: [dev/criterio2-monolito]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ordervoice
          POSTGRES_PASSWORD: ordervoice_test_only
          POSTGRES_DB: ordervoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ordervoice -d ordervoice_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ordervoice:ordervoice_test_only@localhost:5432/ordervoice_test
      ORDERVOICE_BROWSER_STT_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      # Auditoría temporal de reproducibilidad: exportar el lock limpio
      # (sin credenciales) para incorporarlo al repositorio.
      - name: Exportar lockfile sincronizado
        run: |
          node -e 'const b=require("fs").readFileSync("package-lock.json").toString("base64");for(let i=0;i<b.length;i+=2000)console.log("LOCKPART:"+Math.floor(i/2000)+":"+b.slice(i,i+2000))'
      - name: Ejecutar pruebas sin servicios externos
        run: npm test
      - name: Verificar build de producción
        run: npm run build
      - name: Crear tablas y menú en PostgreSQL
        run: npm run db:init
      - name: Levantar el monolito
        run: npm run dev > /tmp/ordervoice-next.log 2>&1 &
      - name: Ejecutar pruebas HTTP y PostgreSQL
        run: |
          npm run test:monolith:http || (cat /tmp/ordervoice-next.log && exit 1)
