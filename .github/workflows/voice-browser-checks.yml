name: OrderVoice AI - browser voice v0.7 checks

on:
  push:
    branches:
      - dev/browser-voice-v0.7
      - dev/browser-stt-v0.8
      - dev/order-intelligence-v0.9
      - dev/handsfree-browser-v1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install locked dependencies
        run: npm ci
      - name: Types and safe orders
        run: |
          npm run typecheck
          npm run test:orders
          npm run test:dialogue
          npm run test:fast
          npm run test:browser:voice
          npm run test:plan
          npm run test:handsfree
